esphome:
  name: "pool-pressure-sensor"
  friendly_name: Pool Pressure Sensor

# Sensor logic (i2c, ads1115, pressure sensors) lives in the GitHub package.
# Push changes to esphome/pool_pressure_sensor.yaml → click Install in ESPHome.
packages:
  pool_sensor: github://EarlCrane/ha-pool-pressure-sensor/esphome/pool_pressure_sensor.yaml@main

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.40.48
    gateway: 192.168.40.1
    subnet: 255.255.255.0

  power_save_mode: none
  fast_connect: true

  ap:
    ssid: "Pool Pressure Fallback"
    password: !secret ap_password

captive_portal:

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory Reset
