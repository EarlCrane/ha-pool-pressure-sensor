# Pool Pressure Sensor — Standalone Example
# ESP32 DevKit V1 + ADS1115 + 0-60 PSI Pressure Transducer
#
# 1. Copy this file to your ESPHome config directory
# 2. Create a secrets.yaml (see secrets.yaml.example) with your credentials
# 3. Adjust the divider_ratio substitution if you used different resistor values
# 4. Flash via USB first, then OTA works for future updates

substitutions:
  device_name: "pool-pressure-sensor"
  friendly_name: "Pool Pressure Sensor"
  pool_sensor_name: "Pool Filter Pressure"
  pool_history_sensor_name: "Pool Filter Pressure History"
  pool_divider_ratio: "0.727"
  pool_update_interval: "2s"
  pool_history_interval: "60s"

# This local include keeps the standalone example and the reusable package on
# exactly the same firmware logic when the repository is cloned.
packages:
  pool_sensor: !include ../esphome/pool_pressure_sensor.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret ha_api_key   # Generate: openssl rand -base64 32

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  # Optional static IP — uncomment and set your own values
  # manual_ip:
  #   static_ip: 192.168.x.x
  #   gateway: 192.168.x.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# -------------------------
# Recovery Buttons
# -------------------------
button:
  - platform: safe_mode
    name: "${friendly_name} Safe Mode"

  - platform: factory_reset
    name: "${friendly_name} Factory Reset"
