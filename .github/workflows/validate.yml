name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python model and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run recovery model tests
        run: python -m unittest discover -s tests -v

      - name: Compile integration
        run: python -m compileall -q custom_components tests

      - name: Validate JSON metadata
        run: |
          python -m json.tool custom_components/pool_filter_analytics/manifest.json >/dev/null
          python -m json.tool custom_components/pool_filter_analytics/strings.json >/dev/null
          python -m json.tool custom_components/pool_filter_analytics/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  esphome:
    name: ESPHome configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.7.1"

      - name: Create validation secrets
        run: |
          cp secrets.yaml.example examples/secrets.yaml
          sed -i 's/base64encodedkeyhere=/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' examples/secrets.yaml

      - name: Validate standalone configuration
        run: esphome config examples/esp32-devkitv1.yaml

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
