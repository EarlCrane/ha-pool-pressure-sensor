name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esphome:
    name: ESPHome configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: python -m pip install "esphome==2026.7.3"

      - name: Create validation secrets
        run: |
          cp secrets.yaml.example examples/secrets.yaml
          sed -i 's/base64encodedkeyhere=/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' examples/secrets.yaml

      - name: Validate standalone configuration
        run: esphome config examples/esp32-devkitv1.yaml
